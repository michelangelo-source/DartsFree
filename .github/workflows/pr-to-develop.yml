name: PR to Develop

on:
  pull_request:
    branches:
      - "develop"

jobs:
  validate-and-scan:
    name: Validate, Scan and Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (package.json)
        run: npm audit --audit-level=high

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Run Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Tests (Jest)
        run: npm run test

      - name: Verify Expo Build
        run: npx expo export --platform android
